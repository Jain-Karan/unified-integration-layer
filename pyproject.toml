[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unified-integration-layer"
version = "0.1.0"
description = "Declarative ingestion of SAP, Salesforce, Kafka and vendor flat files into a canonical model on Apache Iceberg, with data contracts at every boundary."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Karan Jain" }]
dependencies = [
  "pyiceberg[sql-sqlite,pyarrow,duckdb]>=0.9",
  "pydantic>=2.6",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
kafka = ["confluent-kafka>=2.3"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]

[project.scripts]
uil = "uil.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
uil = ["mappings/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
